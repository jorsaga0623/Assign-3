<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JORSGA PHOTO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="nav">
        <nav class="nav-left">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#portfolio">Portfolio</a>
        </nav>
        <a class="logo" href="#">JORSAGA PHOTO</a>
        <nav class="nav-right">
            <a href="#investment">Investment</a>
            <a href="#experiment">Experiment</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Captured your moment in light.</h1>
            <a class="button" href="#portfolio">Explore the work</a>
        </div>
    </section>

    <section id="about" class="about">

        <div class="self-image">
            <img src="images/self.jpg" alt="Portrait of Jorsaga">
        </div>

        <div class="introduction">
            <h2>About Me</h2>
            <p>
                Short introduction about Jorsaga
                and her photography.
            </p>
        </div>

    </section>

    <section id="investment">
        ...
    </section>

    <section id="experiment">
        ...
    </section>

    <section id="contact">
        ...
    </section>

    <section id="portfolio" class="portfolio">
        <div class="portfolio-item">
            <div class="portfolio-text">
                <h3>I. Cosplay</h3>
            </div>

            <div class="portfolio-card cosplay">
                <img src="images/cosplay.jpg" alt="cosplay photography">
            </div>
        </div>

        <div class="portfolio-item">
            <div class="portfolio-text">
                <h3>II. Chinese Culture</h3>
            </div>

            <div class="portfolio-card chinese-culture">
                <img src="images/chinese-culture.jpg" alt="Chinese culture photography">
            </div>

        </div>

        <div class="portfolio-item">
            <div class="portfolio-text">
                <h3>III. Portrait</h3>
            </div>

            <div class="portfolio-card portrait">
                <img src="images/portrait.jpg" alt="Portrait photography">
            </div>

        </div>

        <div class="portfolio-item">
            <div class="portfolio-text">
                <h3>IV. Vintage</h3>
            </div>

            <div class="portfolio-card vintage">
                <img src="images/vintage.jpg" alt="Vintage photography">
            </div>

        </div>

    </section>

    <section class="parallax-section">

        <div class="parallax-image"></div>

    </section>

    <footer>

        <div class="footer-decoration">
            <span>✦</span>
        </div>

        <div class="footer-links">

            <a href="#home">Back to Top</a>

            <a href="#contact">Contact</a>

            <a href="#">FAQ</a>

        </div>

    </footer>

</body>
<script>
    window.addEventListener("scroll", function () {

        const image = document.querySelector(".parallax-image");
        const section = document.querySelector(".parallax-section");

        const sectionTop = section.offsetTop;
        const scrollPosition = window.scrollY;

        const movement = (scrollPosition - sectionTop) * 0.15;

        image.style.transform = `translateY(${movement}px)`;

    });
</script>

</html>
